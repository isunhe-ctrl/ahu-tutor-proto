<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统认知 · 课程知识图谱（上篇 / 下篇）</title>
<style>
  :root{
    --bg:#eef2f9; --panel:#ffffff; --ink:#1f2a44; --muted:#64748b; --line:#e2e8f0;
    --indigo:#4f46e5; --violet:#7c3aed; --teal:#0d9488; --rose:#e11d48; --amber:#d97706;
    --blue:#2563eb; --green:#16a34a; --orange:#ea580c;
    --shadow:0 10px 30px rgba(30,41,59,.10);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1422; --panel:#171c2e; --ink:#e6ebf5; --muted:#9aa6c0; --line:#26304a;
      --shadow:0 10px 30px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(160deg,var(--bg),#e7ecf6 60%,#eef2f9);
    color:var(--ink); padding:18px; -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme: dark){ body{background:linear-gradient(160deg,#0c1020,#11182b 60%,#0f1422);} }
  .wrap{max-width:1320px;margin:0 auto}
  header{
    display:flex;flex-wrap:wrap;align-items:center;gap:14px;
    background:linear-gradient(120deg,var(--indigo),var(--violet));
    color:#fff;border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);
  }
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12.5px;opacity:.82;margin-top:3px}
  .toggle{margin-left:auto;display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:4px;gap:4px}
  .toggle button{
    border:0;cursor:pointer;color:#fff;background:transparent;font-size:13.5px;font-weight:600;
    padding:8px 16px;border-radius:999px;transition:.25s;white-space:nowrap
  }
  .toggle button.active{background:#fff;color:var(--indigo);box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .search{position:relative;flex:0 0 230px}
  .search input{
    width:100%;border:0;border-radius:999px;padding:10px 14px 10px 36px;font-size:13px;
    background:rgba(255,255,255,.92);color:var(--ink);outline:none
  }
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 2px 4px}
  .chip{
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)
  }
  .chip b{color:var(--ink)}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .layout{display:grid;grid-template-columns:minmax(320px,34%) 1fr;gap:16px;margin-top:12px}
  @media (max-width:920px){ .layout{grid-template-columns:1fr} }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
  .panel h2{font-size:13px;margin:2px 4px 12px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .tree{overflow:auto;max-height:74vh;padding-right:4px}
  .tree::-webkit-scrollbar{width:9px;height:9px}
  .tree::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  .node{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;transition:.16s;position:relative}
  .node:hover{background:rgba(79,70,229,.08)}
  .node.sel{background:linear-gradient(90deg,rgba(79,70,229,.16),rgba(124,58,237,.06));box-shadow:inset 0 0 0 1px rgba(79,70,229,.35)}
  .node.match{outline:2px solid rgba(234,88,12,.55)}
  .tw{width:18px;flex:0 0 18px;text-align:center;color:var(--muted);font-size:10px;transition:.2s;user-select:none}
  .node.open .tw{transform:rotate(90deg)}
  .nm{font-size:13.5px;line-height:1.35}
  .node .type{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700;flex:0 0 auto}
  .t-cat{background:rgba(100,116,139,.14);color:var(--muted)}
  .t-kp{background:rgba(79,70,229,.14);color:var(--indigo)}
  .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .badge{font-size:10px;padding:1px 7px;border-radius:999px;font-weight:700;flex:0 0 auto}
  .b-重点{background:rgba(225,29,72,.14);color:var(--rose)}
  .b-难点{background:rgba(234,88,12,.14);color:var(--orange)}
  .b-考点{background:rgba(37,99,235,.14);color:var(--blue)}
  .b-课程思政{background:rgba(22,163,74,.16);color:var(--green)}

  /* ---- 右侧：网络图 ---- */
  .right{display:flex;flex-direction:column;gap:16px;min-width:0}
  .graph-panel{display:flex;flex-direction:column;padding:0;overflow:hidden}
  .gbar{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
  .gbar h2{margin:0;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;flex:1}
  .gtools{display:flex;gap:6px;flex-wrap:wrap}
  .gtools button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;transition:.16s}
  .gtools button:hover{border-color:var(--indigo);color:var(--indigo)}
  .gtools .sep{width:1px;background:var(--line);margin:3px 4px}
  .ghint{font-size:11.5px;color:var(--muted);padding:0 14px 8px}
  .graph-host{position:relative;width:100%;height:62vh;min-height:460px;border-top:1px solid var(--line);overflow:hidden;
    background:radial-gradient(circle at 50% 42%, #f8fafc, #eaeff8)}
  @media (prefers-color-scheme: dark){ .graph-host{background:radial-gradient(circle at 50% 42%, #131a2e, #0f1422)} }
  #graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #graph.panning{cursor:grabbing}
  .gnode{cursor:pointer}
  .gnode circle.body{stroke:#fff;stroke-width:1.5;transition:opacity .15s, stroke-width .15s}
  .gnode circle.ring{fill:none;transition:opacity .15s}
  .gnode text{font-family:inherit;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;
    pointer-events:none;transition:opacity .15s;font-weight:600;text-anchor:middle}
  @media (prefers-color-scheme: dark){ .gnode text{stroke:#0f1422} }
  .gedge{stroke:#94a3b8;stroke-width:1.2;opacity:.45;transition:opacity .15s}
  .dim{opacity:.10 !important}
  .gnode.sel circle.body{stroke:var(--indigo);stroke-width:3.5}
  .gnode.hot circle.body{stroke:var(--rose);stroke-width:3}
  .ghost-tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:5px 9px;font-size:12px;box-shadow:var(--shadow);transform:translate(-50%,-135%);white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);padding:10px 14px 14px;border-top:1px solid var(--line);align-items:center}
  .legend .lg{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:50%}
  .legend .ring{width:11px;height:11px;border-radius:50%;background:transparent;border:2.5px solid #999}
  .legend .sep{width:1px;height:14px;background:var(--line)}

  /* ---- 详情 ---- */
  .detail .crumb{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.6}
  .detail .crumb span{margin:0 2px}
  .detail .crumb b{color:var(--indigo)}
  .detail h3{margin:2px 0 12px;font-size:20px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .kids{margin-top:6px}
  .kids .kt{font-size:12px;color:var(--muted);margin:8px 0 6px;font-weight:700}
  .kids ul{margin:0;padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:7px}
  .kids li{background:rgba(79,70,229,.07);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12.5px;cursor:pointer;transition:.16s}
  .kids li:hover{background:rgba(79,70,229,.16)}
  .empty{color:var(--muted);font-size:13px;padding:30px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>系统认知 · 课程知识图谱</h1>
      <div class="sub">依据《自控原理与楼宇自动化—知识图谱1.xlsx》· 上篇 自动控制原理 / 下篇 楼宇自动化</div>
    </div>
    <div class="toggle">
      <button id="t-up" class="active">上篇 · 自动控制原理</button>
      <button id="t-down">下篇 · 楼宇自动化</button>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" placeholder="搜索知识点 / 分类…">
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="layout">
    <div class="panel">
      <h2 id="tree-title">知识图谱 · 层级结构</h2>
      <div class="tree" id="tree"></div>
    </div>

    <div class="right">
      <div class="panel graph-panel">
        <div class="gbar">
          <h2>知识网络图（力导向）</h2>
          <div class="gtools">
            <button data-act="collapse">收起章节</button>
            <button data-act="lvl2">展开二级</button>
            <button data-act="expand">全展开</button>
            <span class="sep"></span>
            <button data-act="zoomin">＋</button>
            <button data-act="zoomfit">适应</button>
            <button data-act="zoomout">－</button>
          </div>
        </div>
        <div class="ghint">滚轮缩放 · 拖拽空白平移 · 拖拽节点移动 · 单击下钻/选中 · 悬停高亮关联</div>
        <div class="graph-host" id="graphHost">
          <svg id="graph" xmlns="http://www.w3.org/2000/svg"><g id="viewport"><g id="edges"></g><g id="nodes"></g></g></svg>
          <div class="ghost-tip" id="tip"></div>
        </div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="panel detail" id="detail">
        <div class="empty">点击左侧节点或图中节点，查看其知识点分类、标签与下属主题。</div>
      </div>
    </div>
  </div>
</div>

<script src="kg_data.js"></script>
<script>
(function(){
  "use strict";
  var DATA = window.KG_DATA || {};
  var SVGNS = "http://www.w3.org/2000/svg";
  var CAT_COLOR = {"事实性":"#2563eb","概念性":"#7c3aed","程序性":"#0d9488","元认知":"#d97706"};
  var TAG_COLOR = {"重点":"#e11d48","难点":"#ea580c","考点":"#2563eb","课程思政":"#16a34a"};
  var TAG_PRIO  = {"重点":0,"难点":1,"考点":2,"课程思政":3};
  var CLUSTER_PALETTE = ["#4f46e5","#0ea5e9","#10b981","#f59e0b","#ef4444","#8b5cf6","#ec4899","#14b8a6","#f97316","#0891b2","#a855f7","#84cc16"];

  var cur = "上篇";
  var expanded = {};
  var parent = {};
  var part = null;
  var selId = null;

  // ---------- 工具 ----------
  function size(n){ if(n.__s!=null) return n.__s; var s=1; for(var i=0;i<n.children.length;i++) s+=size(n.children[i]); n.__s=s; return s; }
  function buildParent(n,p){ parent[n.id]=p; for(var i=0;i<n.children.length;i++) buildParent(n.children[i],n); }
  function findById(n,id){ if(n.id===id) return n; for(var i=0;i<n.children.length;i++){ var r=findById(n.children[i],id); if(r) return r; } return null; }
  function tagColor(t){ return TAG_COLOR[t]||"#94a3b8"; }

  // 为当前 part 计算 depth 与 depth-1 聚类祖先，并给章节分配颜色
  function annotate(){
    var ci = 0;
    (function walk(n,depth,d1){
      n.__depth = depth; n.__d1 = d1;
      if(depth===1){ n.__color = CLUSTER_PALETTE[ci % CLUSTER_PALETTE.length]; ci++; }
      for(var i=0;i<n.children.length;i++){
        walk(n.children[i], depth+1, depth===0 ? n.children[i] : d1);
      }
    })(part,0,null);
  }
  function colorOf(n){ return (n.__d1 && n.__d1.__color) ? n.__d1.__color : "#64748b"; }
  function radiusOf(n){
    if(n.__depth===0) return 26;
    if(n.__depth===1) return 19;
    if(n.__depth===2) return 14;
    return 9.5;
  }
  function isVisible(n){
    if(n.__depth===0) return true;
    var p = parent[n.id];
    return p && expanded[p.id] && isVisible(p);
  }

  // ---------- 统计 / 树 / 详情（沿用原逻辑） ----------
  function renderStats(){
    var acc={n:0,tags:{},cat:{}};
    (function w(n){ acc.n++; n.tags.forEach(function(t){acc.tags[t]=(acc.tags[t]||0)+1;}); if(n.cat) acc.cat[n.cat]=(acc.cat[n.cat]||0)+1; n.children.forEach(w); })(part);
    var html="";
    html+='<span class="chip"><b>'+acc.n+'</b> 个节点</span>';
    ["重点","难点","考点","课程思政"].forEach(function(t){ if(acc.tags[t]) html+='<span class="chip"><span class="dot" style="background:'+tagColor(t)+'"></span><b>'+acc.tags[t]+'</b> '+t+'</span>'; });
    ["事实性","概念性","程序性","元认知"].forEach(function(c){ if(acc.cat[c]) html+='<span class="chip"><span class="dot" style="background:'+CAT_COLOR[c]+'"></span><b>'+acc.cat[c]+'</b> '+c+'</span>'; });
    document.getElementById("stats").innerHTML=html;
  }

  function nodeRow(n,depth){
    var has=!!n.children.length;
    var d=document.createElement("div");
    d.className="node"+(expanded[n.id]?" open":"")+(n.id===selId?" sel":"");
    d.style.paddingLeft=(8+depth*16)+"px";
    d.dataset.id=n.id;
    var tw=document.createElement("span"); tw.className="tw"; tw.textContent= has?"▶":"";
    var nm=document.createElement("span"); nm.className="nm"; nm.textContent=n.name;
    var type=document.createElement("span"); type.className="type "+(n.type==="分类"?"t-cat":"t-kp"); type.textContent=n.type;
    d.appendChild(tw); d.appendChild(type); d.appendChild(nm);
    if(n.cat && CAT_COLOR[n.cat]){ var c=document.createElement("span"); c.className="cdot"; c.style.background=CAT_COLOR[n.cat]; d.appendChild(c); }
    n.tags.forEach(function(t){ if(TAG_COLOR[t]){ var b=document.createElement("span"); b.className="badge b-"+t; b.textContent=t; d.appendChild(b); } });
    d.addEventListener("click",function(e){ e.stopPropagation(); if(has){ expanded[n.id]=!expanded[n.id]; renderTree(); rebuildGraph(); } select(n.id); });
    return d;
  }
  function visibleInTree(n,depth,q){
    if(!q) return true;
    if(n.name.toLowerCase().indexOf(q)>=0) return true;
    for(var i=0;i<n.children.length;i++){ if(visibleInTree(n.children[i],depth+1,q)) return true; }
    return false;
  }
  function renderTree(){
    var q=(document.getElementById("q").value||"").trim().toLowerCase();
    var host=document.getElementById("tree"); host.innerHTML="";
    document.getElementById("tree-title").textContent = cur+" · "+(q?("搜索："+q):"层级结构");
    (function walk(n,depth){
      if(!visibleInTree(n,depth,q)) return;
      host.appendChild(nodeRow(n,depth));
      if(n.children.length && (expanded[n.id]||q)){
        for(var i=0;i<n.children.length;i++) walk(n.children[i],depth+1);
      }
    })(part,0);
    if(!host.children.length) host.innerHTML='<div class="empty">未找到匹配 “'+q+'” 的节点。</div>';
  }

  function select(id){
    selId=id; renderTree(); renderDetail(findById(part,id)); highlightNode(id);
  }
  function renderDetail(n){
    var host=document.getElementById("detail");
    if(!n){ host.innerHTML='<div class="empty">点击左侧节点或图中节点，查看其知识点分类、标签与下属主题。</div>'; return; }
    var chain=[]; var x=n; while(x){ chain.unshift(x); x=parent[x.id]; }
    var crumb=chain.map(function(c,i){ return (i?"<span>›</span>":"")+"<b>"+c.name+"</b>"; }).join("");
    var html='<div class="crumb">'+crumb+'</div>';
    html+='<h3>'+n.name+'</h3>';
    html+='<div class="meta">';
    html+='<span class="badge '+(n.type==="分类"?"t-cat":"t-kp")+'" style="color:'+(n.type==="分类"?"var(--muted)":"var(--indigo)")+';background:'+(n.type==="分类"?"rgba(100,116,139,.14)":"rgba(79,70,229,.14)")+'">'+n.type+'</span>';
    if(n.cat) html+='<span class="badge" style="color:'+CAT_COLOR[n.cat]+';background:rgba(79,70,229,.07)">'+n.cat+'</span>';
    n.tags.forEach(function(t){ if(TAG_COLOR[t]) html+='<span class="badge b-'+t+'">'+t+'</span>'; });
    html+='</div>';
    if(n.children.length){
      html+='<div class="kids"><div class="kt">下属主题（'+n.children.length+'）· 点击可在图中展开</div><ul>';
      n.children.forEach(function(c){ html+='<li data-id="'+c.id+'">'+c.name+'</li>'; });
      html+='</ul></div>';
    } else {
      html+='<div class="kids"><div class="empty" style="padding:14px">该节点为末端知识点。</div></div>';
    }
    host.innerHTML=html;
    Array.prototype.forEach.call(host.querySelectorAll(".kids li"),function(li){
      li.addEventListener("click",function(){ var id=+li.dataset.id; expanded[id]=true; renderTree(); rebuildGraph(); select(id);
        var el=document.querySelector('.node[data-id="'+id+'"]'); if(el) el.scrollIntoView({block:"center",behavior:"smooth"}); });
    });
  }

  // ================= 力导向网络图 =================
  var svg = document.getElementById("graph");
  var viewport = document.getElementById("viewport");
  var gEdges = document.getElementById("edges");
  var gNodes = document.getElementById("nodes");
  var tip = document.getElementById("tip");
  var host = document.getElementById("graphHost");

  var G = [];          // 当前可见图节点 {id,name,type,cat,tags,depth,d1,color,r,x,y,vx,vy,fixed,el,ringEl,txtEl}
  var E = [];          // 当前可见边 {s,t,el}
  var byId = {};       // id -> G节点（跨重建保留坐标）
  var neighbors = {};  // id -> {id:true}
  var W=900, H=600, cx=450, cy=300;
  var panX=0, panY=0, k=1;
  var alpha=0, raf=null, dragging=null, panning=false, lastP=null;

  // 力参数
  var KREP=2400, LINKLEN=64, SPRING=0.022, GRAV=0.012, DAMP=0.82, ALPHA_DECAY=0.975, COLLIDE_PAD=6;

  function measure(){
    var r = host.getBoundingClientRect();
    W = Math.max(320, r.width); H = Math.max(360, r.height);
    cx = W/2; cy = H/2;
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    svg.setAttribute("viewBox", "0 0 "+W+" "+H);
  }

  function rebuildGraph(){
    annotate();
    // 收集可见节点
    var visNodes=[];
    (function walk(n){ if(!isVisible(n)) return; visNodes.push(n); for(var i=0;i<n.children.length;i++) walk(n.children[i]); })(part);

    // 保留旧坐标
    var old = byId; byId = {}; G = []; E = []; neighbors = {};
    var i, n, g;
    for(i=0;i<visNodes.length;i++){
      n = visNodes[i];
      g = old[n.id];
      if(!g){
        g = { id:n.id, x: (parent[n.id] && old[parent[n.id].id] ? old[parent[n.id].id].x : cx) + (Math.random()-0.5)*80,
                          y: (parent[n.id] && old[parent[n.id].id] ? old[parent[n.id].id].y : cy) + (Math.random()-0.5)*80,
              vx:0, vy:0, fixed:false, ref:n };
        if(!parent[n.id]){ g.x=cx; g.y=cy; }
      }
      g.ref = n; g.depth=n.__depth; g.color=colorOf(n); g.r=radiusOf(n);
      g.name=n.name; g.type=n.type; g.cat=n.cat; g.tags=n.tags;
      byId[n.id]=g; G.push(g); neighbors[n.id]={};
    }
    // 边
    for(i=0;i<G.length;i++){
      n = G[i].ref;
      if(parent[n.id] && byId[parent[n.id].id]){
        E.push({ s: byId[parent[n.id].id], t: G[i] });
        neighbors[G[i].id][parent[n.id].id]=true;
        neighbors[parent[n.id].id][G[i].id]=true;
      }
    }
    renderGraphDOM();
    if(G.length>=260){ preSettle(320); applyPositions(); }
    else reheat(0.9, 220);
  }

  function renderGraphDOM(){
    gEdges.innerHTML=""; gNodes.innerHTML="";
    var i, e, line;
    for(i=0;i<E.length;i++){
      e=E[i]; line=document.createElementNS(SVGNS,"line");
      line.setAttribute("class","gedge"); e.el=line; gEdges.appendChild(line);
    }
    var g, grp, body, ring, txt, tagRing=null;
    for(i=0;i<G.length;i++){
      g=G[i];
      grp=document.createElementNS(SVGNS,"g"); grp.setAttribute("class","gnode");
      body=document.createElementNS(SVGNS,"circle"); body.setAttribute("class","body");
      body.setAttribute("r", g.r); body.setAttribute("fill", g.color);
      // 标签环（取优先级最高的标签）
      var best=null; for(var t=0;t<g.tags.length;t++){ if(TAG_COLOR[g.tags[t]] && (!best || TAG_PRIO[g.tags[t]]<TAG_PRIO[best])) best=g.tags[t]; }
      if(best){
        ring=document.createElementNS(SVGNS,"circle"); ring.setAttribute("class","ring");
        ring.setAttribute("r", g.r+3.5); ring.setAttribute("stroke", TAG_COLOR[best]); ring.setAttribute("stroke-width","3");
        grp.appendChild(ring); g.ringEl=ring;
      }
      txt=document.createElementNS(SVGNS,"text");
      txt.setAttribute("font-size", g.depth<=1? "13" : (g.depth===2? "11.5":"10.5"));
      txt.textContent = g.name;
      grp.appendChild(body); grp.appendChild(txt);
      g.el=grp; g.bodyEl=body; g.txtEl=txt;
      grp.addEventListener("pointerenter", (function(gg){ return function(){ hover(gg); }; })(g));
      grp.addEventListener("pointerleave", function(){ unhover(); });
      grp.addEventListener("pointerdown", (function(gg){ return function(evt){ evt.stopPropagation(); startNodeDrag(evt,gg); }; })(g));
      grp.addEventListener("click", (function(gg){ return function(evt){ evt.stopPropagation(); onNodeClick(gg); }; })(g));
      gNodes.appendChild(grp);
    }
    applyPositions();
  }

  function onNodeClick(g){
    var n=g.ref;
    // 选中 + 下钻：若含子节点且当前收起，则展开
    if(n.children.length && !expanded[n.id]){ expanded[n.id]=true; renderTree(); rebuildGraph(); }
    select(n.id);
  }
  function highlightNode(id){
    Array.prototype.forEach.call(gNodes.querySelectorAll(".gnode"),function(el){ el.classList.remove("sel"); });
    var g = byId[id]; if(g && g.el){ g.el.classList.add("sel"); }
  }

  function hover(g){
    var keep={}; keep[g.id]=true;
    if(neighbors[g.id]){ for(var kk in neighbors[g.id]) keep[kk]=true; }
    for(var i=0;i<G.length;i++){ G[i].el.classList.toggle("dim", !keep[G[i].id]); }
    for(i=0;i<E.length;i++){ var s=E[i].s.id, t=E[i].t.id; E[i].el.classList.toggle("dim", !(keep[s]&&keep[t])); }
    if(g.ringEl) g.ringEl.classList.remove("dim"); g.el.classList.remove("dim");
    // tooltip
    var r = host.getBoundingClientRect();
    tip.textContent = g.name + (g.type==="分类" ? " · 分类" : " · 知识点");
    tip.style.left = (g.x*k+panX) + "px";
    tip.style.top  = (g.y*k+panY - g.r*k - 6) + "px";
    tip.style.opacity = "1";
  }
  function unhover(){
    for(var i=0;i<G.length;i++) G[i].el.classList.remove("dim");
    for(i=0;i<E.length;i++) E[i].el.classList.remove("dim");
    tip.style.opacity="0";
  }

  function applyPositions(){
    var i;
    for(i=0;i<E.length;i++){
      E[i].el.setAttribute("x1",E[i].s.x); E[i].el.setAttribute("y1",E[i].s.y);
      E[i].el.setAttribute("x2",E[i].t.x); E[i].el.setAttribute("y2",E[i].t.y);
    }
    for(i=0;i<G.length;i++){
      G[i].el.setAttribute("transform","translate("+G[i].x+","+G[i].y+")");
      G[i].txtEl.setAttribute("y", G[i].r + (G[i].depth<=1? 4.5 : 3.2));
    }
    viewport.setAttribute("transform","translate("+panX+","+panY+") scale("+k+")");
  }

  // ---- 力学 ----
  function step(a){
    var i,j,n=G.length, A,B, dx,dy,d,d2,f,ux,uy;
    for(i=0;i<n;i++){ G[i].fx=0; G[i].fy=0; }
    // 斥力
    for(i=0;i<n;i++){ A=G[i];
      for(j=i+1;j<n;j++){ B=G[j];
        dx=A.x-B.x; dy=A.y-B.y; d2=dx*dx+dy*dy; if(d2<1) d2=1; d=Math.sqrt(d2);
        f=KREP/d2; ux=dx/d; uy=dy/d;
        A.fx+=ux*f; A.fy+=uy*f; B.fx-=ux*f; B.fy-=uy*f;
      }
    }
    // 弹簧
    for(i=0;i<E.length;i++){ A=E[i].s; B=E[i].t;
      dx=B.x-A.x; dy=B.y-A.y; d=Math.sqrt(dx*dx+dy*dy)||0.01;
      f=(d-LINKLEN)*SPRING; ux=dx/d; uy=dy/d;
      A.fx+=ux*f; A.fy+=uy*f; B.fx-=ux*f; B.fy-=uy*f;
    }
    // 向心
    for(i=0;i<n;i++){ G[i].fx+=(cx-G[i].x)*GRAV; G[i].fy+=(cy-G[i].y)*GRAV; }
    // 积分
    for(i=0;i<n;i++){ A=G[i]; if(A.fixed) continue;
      A.vx=(A.vx+A.fx)*DAMP; A.vy=(A.vy+A.fy)*DAMP;
      A.x+=A.vx*a; A.y+=A.vy*a;
    }
    // 碰撞分离
    for(i=0;i<n;i++){ A=G[i];
      for(j=i+1;j<n;j++){ B=G[j];
        dx=A.x-B.x; dy=A.y-B.y; d=Math.sqrt(dx*dx+dy*dy); var min=A.r+B.r+COLLIDE_PAD;
        if(d<min && d>0.01){ var push=(min-d)/2; ux=dx/d; uy=dy/d;
          if(!A.fixed){ A.x+=ux*push; A.y+=uy*push; } if(!B.fixed){ B.x-=ux*push; B.y-=uy*push; } }
      }
    }
  }
  function preSettle(iters){ for(var i=0;i<iters;i++) step(Math.max(0.05, 1 - i/iters*0.95)); }
  function reheat(a, frames){
    alpha=a; var f=0;
    if(raf) cancelAnimationFrame(raf);
    function loop(){
      step(alpha); alpha*=ALPHA_DECAY; f++; applyPositions();
      if(alpha>0.02 && f<frames) raf=requestAnimationFrame(loop);
      else { alpha=0; applyPositions(); }
    }
    raf=requestAnimationFrame(loop);
  }

  // ---- 缩放/平移 ----
  function toGraph(evt){
    var r=svg.getBoundingClientRect();
    return { x:(evt.clientX-r.left-panX)/k, y:(evt.clientY-r.top-panY)/k };
  }
  function zoomAt(mx,my,factor){
    var nk=Math.max(0.2, Math.min(4, k*factor));
    panX = mx - (mx-panX)*(nk/k); panY = my - (my-panY)*(nk/k); k=nk;
    applyPositions();
  }
  function fit(){
    if(!G.length) return;
    var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9,i;
    for(i=0;i<G.length;i++){ minx=Math.min(minx,G[i].x-G[i].r); maxx=Math.max(maxx,G[i].x+G[i].r);
      miny=Math.min(miny,G[i].y-G[i].r); maxy=Math.max(maxy,G[i].y+G[i].r); }
    var bw=maxx-minx||1, bh=maxy-miny||1, pad=40;
    var nk=Math.min((W-pad)/bw, (H-pad)/bh); nk=Math.max(0.2,Math.min(2.2,nk));
    k=nk; panX=(W-(minx+maxx)*k)/2; panY=(H-(miny+maxy)*k)/2; applyPositions();
  }

  // ---- 交互 ----
  function startNodeDrag(evt,g){
    dragging=g; g.fixed=true; g.vx=0; g.vy=0;
    var p=toGraph(evt); g.x=p.x; g.y=p.y; applyPositions();
    window.addEventListener("pointermove", onDragMove);
    window.addEventListener("pointerup", onDragUp);
  }
  function onDragMove(evt){ if(!dragging) return; var p=toGraph(evt); dragging.x=p.x; dragging.y=p.y; applyPositions(); }
  function onDragUp(){ if(dragging){ dragging.fixed=false; dragging=null; reheat(0.4,80); }
    window.removeEventListener("pointermove", onDragMove); window.removeEventListener("pointerup", onDragUp); }

  svg.addEventListener("pointerdown", function(evt){
    panning=true; svg.classList.add("panning"); lastP={x:evt.clientX,y:evt.clientY};
    window.addEventListener("pointermove", onPanMove);
    window.addEventListener("pointerup", onPanUp);
  });
  function onPanMove(evt){ if(!panning) return; panX+=evt.clientX-lastP.x; panY+=evt.clientY-lastP.y; lastP={x:evt.clientX,y:evt.clientY}; applyPositions(); }
  function onPanUp(){ panning=false; svg.classList.remove("panning");
    window.removeEventListener("pointermove", onPanMove); window.removeEventListener("pointerup", onPanUp); }

  svg.addEventListener("wheel", function(evt){ evt.preventDefault();
    var r=svg.getBoundingClientRect(); zoomAt(evt.clientX-r.left, evt.clientY-r.top, evt.deltaY<0?1.12:1/1.12);
  }, {passive:false});

  // 工具栏
  document.querySelector(".gtools").addEventListener("click", function(evt){
    var b=evt.target.closest("button"); if(!b) return; var act=b.dataset.act;
    if(act==="zoomin"){ zoomAt(W/2,H/2,1.18); }
    else if(act==="zoomout"){ zoomAt(W/2,H/2,1/1.18); }
    else if(act==="zoomfit"){ fit(); }
    else if(act==="collapse"){ expandTo(1); }
    else if(act==="lvl2"){ expandTo(2); }
    else if(act==="expand"){ expandTo(99); }
  });
  function expandTo(d){
    expanded={};
    (function w(n){ if(n.__depth < d) expanded[n.id]=true; for(var i=0;i<n.children.length;i++) w(n.children[i]); })(part);
    renderTree(); rebuildGraph();
  }

  // 图例
  function renderLegend(){
    var html="";
    var seen={};
    // 章节聚类
    for(var i=0;i<part.children.length;i++){ var c=part.children[i]; if(c.__color && !seen[c.__color]){ seen[c.__color]=1;
      html+='<span class="lg"><i style="background:'+c.__color+'"></i>'+c.name+'</span>'; } }
    html+='<span class="sep"></span>';
    // 标签环
    [["重点","#e11d48"],["难点","#ea580c"],["考点","#2563eb"],["课程思政","#16a34a"]].forEach(function(p){
      html+='<span class="lg"><span class="ring" style="border-color:'+p[1]+'"></span>'+p[0]+'</span>'; });
    html+='<span class="sep"></span>';
    html+='<span class="lg" style="color:var(--muted)">节点越大＝层级越高</span>';
    document.getElementById("legend").innerHTML=html;
  }

  // 搜索联动
  function doSearch(){
    var q=(document.getElementById("q").value||"").trim().toLowerCase();
    renderTree();
    // 图中高亮匹配
    if(!q){ unhover(); return; }
    var any=null;
    for(var i=0;i<G.length;i++){ var m=G[i].name.toLowerCase().indexOf(q)>=0; G[i].el.classList.toggle("dim", !m);
      if(m && !any) any=G[i]; }
    for(i=0;i<E.length;i++) E[i].el.classList.add("dim");
    if(any){ // 居中
      k=Math.max(k,1); panX=W/2-any.x*k; panY=H/2-any.y*k; applyPositions();
    }
  }

  // ---------- 生命周期 ----------
  function setPart(key){
    cur=key; part=DATA[key]; buildParent(part,null);
    expanded={}; (function open(n,d){ if(d<=1) expanded[n.id]=true; for(var i=0;i<n.children.length;i++) open(n.children[i],d+1); })(part,0);
    selId=null; panX=0; panY=0; k=1;
    measure(); renderStats(); renderTree(); rebuildGraph(); renderLegend();
    document.getElementById("detail").innerHTML='<div class="empty">点击左侧节点或图中节点，查看其知识点分类、标签与下属主题。</div>';
    setTimeout(fit, 60);
  }

  window.addEventListener("resize", function(){ measure(); applyPositions(); });

  document.getElementById("t-up").addEventListener("click",function(){ this.classList.add("active"); document.getElementById("t-down").classList.remove("active"); document.getElementById("q").value=""; setPart("上篇"); });
  document.getElementById("t-down").addEventListener("click",function(){ this.classList.add("active"); document.getElementById("t-up").classList.remove("active"); document.getElementById("q").value=""; setPart("下篇"); });
  document.getElementById("q").addEventListener("input", doSearch);

  setPart("上篇");
})();
</script>
</body>
